<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T3_068</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
    </style>
</head>

<body>
    <h2>Program T3_068 (Min, Max, Rata-rata)</h2>

    <label for="inputArray">Masukkan angka (pisahkan dengan koma): </label>
    <input type="text" id="inputArray" placeholder="Contoh: 10, 20, 30, 40, 50">
    <button onclick="hitungDanTampilkan()">Hitung</button>

    <!-- Area untuk menampilkan hasil -->
    <div id="result"></div>

    <script>
        // Fungsi untuk menghitung rata-rata array menggunakan fungsi panah
        const hitungRataRata = (arr) => {
            const total = arr.reduce((acc, val) => acc + val, 0); // Menghitung total dengan reduce
            return total / arr.length; // Mengembalikan rata-rata
        };

        // Fungsi untuk menghitung jumlah angka yang lebih besar dari rata-rata
        const hitungLebihBesarDariRataRata = (arr) => {
            const rataRata = hitungRataRata(arr); // Menghitung rata-rata
            // Menggunakan meotde filter untuk mendapatkan angka yang lebih besar dari rata-rata
            const angkaDiAtasRataRata = arr.filter(val => val > rataRata);
            return angkaDiAtasRataRata.length; // Mengembalikan jumlah elemen di atas rata-rata
        };

        // Fungsi untuk menghitung dan menampilkan hasil
        function hitungDanTampilkan() {
            const input = document.getElementById('inputArray').value; // Mendapatkan nilai input
            // Memisahkan input menjadi array angka
            const arr = input.split(',').map(num => parseFloat(num.trim())); // Mengubah string menjadi array angka

            // Menghitung hasil menggunakan fungsi yang sudah dibuat
            const rataRata = hitungRataRata(arr);
            const jumlahLebihBesar = hitungLebihBesarDariRataRata(arr);

            // Menampilkan hasil perhitungan
            document.getElementById('result').innerHTML = `
                <p>Nilai Minimum: ${Math.min(...arr)}</p>
                <p>Nilai Maximum: ${Math.max(...arr)}</p>
                <p>Rata-rata: ${rataRata.toFixed(2)}</p>
            `;

            // Validasi input
            if (arr.some(isNaN)) {
                alert('Masukkan array yang valid dengan angka yang benar!');
                document.getElementById('result').innerHTML = ''; // Bersihkan hasil jika input tidak valid
            }
        }
    </script>

</body>
</html>
